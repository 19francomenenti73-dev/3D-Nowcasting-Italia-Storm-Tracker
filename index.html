<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nowcasting Italia - 3D Storm Tracker & Multi-Risk Dashboard</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
html,body{
 margin:0;padding:0;width:100%;height:100%;
 font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
 background-color:#0f172a
}
#map{
 width:100%;height:100%;
 background-color:#0f172a
}
.tracker-counter{
 position:absolute;bottom:25px;left:50%;
 transform:translateX(-50%);z-index:1000;
 background:rgba(255,255,255,.95);
 padding:10px 20px;border-radius:12px;
 box-shadow:0 4px 15px rgba(0,0,0,.3);
 font-weight:bold;font-size:13px;color:#1e293b;
 display:flex;align-items:center;gap:8px;
 border:1px solid rgba(0,0,0,.1)
}
.custom-storm-marker{
 background:transparent;border:none
}
@keyframes quakeFlash{
 0%{
  transform:scale(1);opacity:1;
  box-shadow:0 0 0 0 rgba(239,68,68,.8)
 }
 70%{
  transform:scale(1.3);opacity:.7;
  box-shadow:0 0 0 10px rgba(239,68,68,0)
 }
 100%{
  transform:scale(1);opacity:1;
  box-shadow:0 0 0 0 rgba(239,68,68,0)
 }
}
.quake-active-flash{
 background-color:#ef4444;border-radius:50%;
 width:16px;height:16px;border:2px solid #fff;
 animation:quakeFlash 1.5s infinite
}
.quake-aged{
 background-color:#f97316;border-radius:50%;
 width:8px;height:8px;border:1px solid #fff
}
</style>
</head>
<body>
<div id="map"></div>
<div id="counter-badge" class="tracker-counter">
 <span>Inizializzazione Multi-Risk Dashboard...</span>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const map=L.map('map',{
 zoomControl:false
}).setView([42.5,12.5],6);

L.control.zoom({position:'topright'}).addTo(map);

// Cartografia OpenStreetMap
L.tileLayer(
 'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
 {
  attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap contributors</a>',
  maxZoom:19
 }
).addTo(map);

// Radar RainViewer
fetch('https://api.rainviewer.com/public/weather-maps.json')
 .then(res=>res.json())
 .then(data=>{
  if(data.radar&&data.radar.past&&data.radar.past.length>0){
   const latestRadar=data.radar.past[
    data.radar.past.length-1
   ];

   L.tileLayer(
    `${data.host}${latestRadar.path}/256/{z}/{x}/{y}/2/1_1.png`,
    {
     opacity:.55,
     zIndex:200,
     attribution:'&copy; RainViewer'
    }
   ).addTo(map);
  }
 })
 .catch(err=>console.log("Errore tile radar:",err));

// Caricamento celle temporalesche
function loadStormCells(){
 const jsonUrl='storm_cells.json?t='+new Date().getTime();

 fetch(jsonUrl)
 .then(response=>{
  if(!response.ok){
   throw new Error(
    `File JSON non trovato (${response.status})`
   );
  }
  return response.json();
 })
 .then(data=>{
  if(!data.macro_structures){
   throw new Error("Struttura JSON non valida");
  }

  const count=data.macro_structures.length;

  document.getElementById('counter-badge').innerHTML=`
   <span style="width:10px;height:10px;background-color:#22c55e;border-radius:50%;display:inline-block"></span>
   Storm Tracker: <b>${count}</b> celle attive
  `;

  data.macro_structures.forEach(cell=>{
   const profileIcon=L.divIcon({
    className:'custom-storm-marker',
    html:`
     <div style="text-align:center;pointer-events:auto;cursor:pointer">
      <img src="${cell.profile_image}"
       style="width:80px;height:48px;display:block;margin:0 auto;filter:drop-shadow(0px 3px 6px rgba(0,0,0,.6))"
       alt="${cell.id}">
      <span style="background:rgba(15,23,42,.9);color:#38bdf8;padding:2px 7px;font-size:10px;font-weight:bold;border-radius:4px;border:1px solid rgba(56,189,248,.4);white-space:nowrap;box-shadow:0 2px 4px rgba(0,0,0,.3)">
       ${cell.id}
      </span>
     </div>
    `,
    iconSize:[90,70],
    iconAnchor:[45,70]
   });

   const marker=L.marker(
    cell.center,{icon:profileIcon}
   ).addTo(map);

   // Vettore storico
   if(cell.actual_path&&cell.actual_path.length>0){
    L.polyline(cell.actual_path,{
     color:'#38bdf8',
     weight:3,
     dashArray:'4, 4',
     opacity:.8
    }).addTo(map);
   }

   // Vettore previsionale
   if(cell.forecast_path&&cell.forecast_path.length>0){
    L.polyline(cell.forecast_path,{
     color:'#22c55e',
     weight:4,
     opacity:.9
    }).addTo(map);
   }

   // Cerchio di attenzione
   L.circle(cell.center,{
    radius:20000,
    color:'#22c55e',
    fillColor:'#22c55e',
    fillOpacity:.08,
    weight:1,
    dashArray:'5, 5'
   }).addTo(map);

   // Popup meteorologico
   const popupContent=`
    <div style="font-family:sans-serif;font-size:13px;line-height:1.5;color:#1e293b;min-width:220px">
     <b style="font-size:14px;color:#0f172a">ID Cellula:</b>
     ${cell.id}<br>
     <b>Tipologia:</b>
     <span style="color:#2563eb;font-weight:bold">${cell.convective_type}</span><br>
     <b>Intensità Picco:</b>
     <span style="color:#dc2626;font-weight:bold">${cell.intensity}</span><br>
     <b>Velocità:</b> ${cell.speed_kmh} km/h<br>
     <b>Direzione:</b> ${cell.direction_deg}°<br>
     <hr style="margin:4px 0;border:none;border-top:1px solid #cbd5e1">
     <b>🌧️ Rain Rate:</b>
     <span style="color:#2563eb;font-weight:bold">${cell.rain_rate_h||0.0} mm/h</span><br>
     <b>💧 Accumulo Stimato:</b>
     <span style="color:#0284c7;font-weight:bold">${cell.total_accumulation_mm||0.0} mm</span><br>
     <hr style="margin:4px 0;border:none;border-top:1px solid #cbd5e1">
     <b>Echo Top:</b>
     <span style="color:#d97706;font-weight:bold">${cell.echo_top} km</span><br>
     <b>VIL:</b> ${cell.vil} kg/m²<br>
     <b>Attendibilità:</b>
     <span style="color:#16a34a;font-weight:bold">${cell.confidence||'92.0% (Alta)'}</span><br>
    </div>
   `;

   marker.bindPopup(popupContent);
  });
 })
 .catch(error=>{
  console.error("Errore di caricamento:",error);

  document.getElementById('counter-badge').innerHTML=`
   <span style="width:10px;height:10px;background-color:#ef4444;border-radius:50%;display:inline-block"></span>
   <b style="color:#dc2626">Errore:</b> ${error.message}
  `;
 });
}
    
function loadEarthquakes(){
 fetch(
  'https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/all_day.geojson'
 )
 .then(res=>res.json())
 .then(data=>{
  const now=new Date().getTime();

  data.features.forEach(quake=>{
   const mag=quake.properties.mag;
   const time=quake.properties.time;
   const place=quake.properties.place;
   const depth=quake.geometry.coordinates[2];

   const coords=[
    quake.geometry.coordinates[1],
    quake.geometry.coordinates[0]
   ];

   const diffHours=(now-time)/(1000*60*60);

   if(mag>=3.5&&diffHours<=24){
    let iconClass='quake-aged';
    let iconSize=[8,8];
    let iconAnchor=[4,4];

    if(diffHours<=1){
     iconClass='quake-active-flash';
     iconSize=[16,16];
     iconAnchor=[8,8];
    }

    const quakeIcon=L.divIcon({
     className:iconClass,
     iconSize:iconSize,
     iconAnchor:iconAnchor
    });

    const marker=L.marker(
     coords,{icon:quakeIcon}
    ).addTo(map);

    const timeAgoMin=Math.round(diffHours*60);

    marker.bindPopup(`
     <div style="font-family:sans-serif;font-size:12px;line-height:1.4;color:#1e293b;min-width:190px">
      <b style="color:#dc2626;font-size:13px">
       ⚠️ EVENTO SISMICO
      </b><br>
      <b>Magnitudo:</b> M ${mag.toFixed(1)}<br>
      <b>Località:</b> ${place}<br>
      <b>Profondità:</b> ${depth} km<br>
      <b>Registrato:</b>
      ${timeAgoMin<=60?
       timeAgoMin+' min fa':
       Math.round(diffHours)+' ore fa'}<br>
      <span style="font-size:10px;color:#64748b">
       Soglia M ≥ 3.5 (Open Data)
      </span>
     </div>
    `);
   }
  });
 })
 .catch(err=>{
  console.log("Errore dati sismici:",err);
 });
}

// Avvio dei moduli autorizzati nel progetto
loadStormCells();
loadEarthquakes();

// Aggiornamento celle ogni 5 minuti
setInterval(()=>{
 loadStormCells();
},300000);
</script>
</body>
</html>
