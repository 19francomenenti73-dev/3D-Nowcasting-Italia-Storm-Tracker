<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>3D Storm Tracker Italia</title>
  <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no">
  <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
  <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
  <style>
    body { margin: 0; padding: 0; background: #0a0e17; font-family: sans-serif; overflow: hidden; }
    #map { position: absolute; top: 0; bottom: 0; width: 100%; }
    .pulsing-centroid {
      display: block;
      border-radius: 50%;
      background: rgba(255, 30, 30, 0.9);
      border: 2px solid #ffffff;
      box-shadow: 0 0 15px rgba(255, 0, 0, 0.8);
      animation: pulse-ring 1.2s infinite;
      cursor: pointer;
    }
    @keyframes pulse-ring {
      0% { transform: scale(0.9); box-shadow: 0 0 0 0 rgba(255, 30, 30, 0.9); }
      70% { transform: scale(1.1); box-shadow: 0 0 0 15px rgba(255, 30, 30, 0); }
      100% { transform: scale(0.9); box-shadow: 0 0 0 0 rgba(255, 30, 30, 0); }
    }
  </style>
</head>
<body>
<div id="map"></div>
<script>
  const map = new maplibregl.Map({
    container: 'map',
    style: {
      version: 8,
      sources: {
        'dark-tiles': {
          type: 'raster',
          tiles: [
            'https://basemaps.cartocdn.com/rastertiles/dark_all/{z}/{x}/{y}.png'
          ],
          tileSize: 256,
          attribution: '&copy; OpenStreetMap contributors &copy; CARTO'
        }
      },
      layers: [{
        id: 'dark-layer',
        type: 'raster',
        source: 'dark-tiles',
        minzoom: 0,
        maxzoom: 19
      }]
    },
    center: [12.50, 41.90],
    zoom: 6,
    pitch: 45
  });

  map.addControl(new maplibregl.NavigationControl());

  async function loadStorms() {
    try {
      const res = await fetch('storm_cells.json?v=' + Date.now());
      if (!res.ok) return;
      const data = await res.json();
      if (!data.cells) return;

      data.cells.forEach(cell => {
        const el = document.createElement('div');
        el.className = 'pulsing-centroid';
        el.style.width = '28px';
        el.style.height = '28px';

        new maplibregl.Marker({ element: el })
          .setLngLat([cell.centroid[1], cell.centroid[0]])
          .addTo(map);

        if (cell.predictive_vector) {
          map.addSource('pred-' + cell.id, {
            type: 'geojson',
            data: {
              type: 'Feature',
              geometry: {
                type: 'LineString',
                coordinates: [
                  [cell.centroid[1], cell.centroid[0]],
                  [cell.predictive_vector[1], cell.predictive_vector[0]]
                ]
              }
            }
          });
          map.addLayer({
            id: 'pred-line-' + cell.id,
            type: 'line',
            source: 'pred-' + cell.id,
            paint: { 'line-color': '#ff9900', 'line-width': 3, 'line-dasharray': [2, 2] }
          });
        }
      });
    } catch (e) {}
  }

  map.on('load', loadStorms);
</script>
</body>
</html>
