<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nowcasting Italia - 3D Storm Tracker & Multi-Risk Dashboard</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0f172a;
        }
        #map {
            width: 100%;
            height: 100%;
            background-color: #0f172a;
        }
        .tracker-counter {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            background: rgba(15, 23, 42, 0.92);
            backdrop-filter: blur(6px);
            padding: 10px 18px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
            font-weight: 600;
            font-size: 13px;
            color: #f8fafc;
            display: flex;
            align-items: center;
            gap: 10px;
            border: 1px solid rgba(56, 189, 248, 0.3);
            white-space: nowrap;
        }
        .custom-storm-marker {
            background: transparent;
            border: none;
        }
        
        /* Animazioni e stili per i Terremoti */
        @keyframes quakeFlash {
            0% { transform: scale(1); opacity: 1; box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.8); }
            70% { transform: scale(1.3); opacity: 0.7; box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
            100% { transform: scale(1); opacity: 1; box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
        .quake-active-flash {
            background-color: #ef4444;
            border-radius: 50%;
            width: 16px;
            height: 16px;
            border: 2px solid #ffffff;
            animation: quakeFlash 1.5s infinite;
        }
        .quake-aged {
            background-color: #f97316;
            border-radius: 50%;
            width: 8px;
            height: 8px;
            border: 1px solid #ffffff;
        }
        .lightning-icon {
            background: transparent;
            font-size: 14px;
            text-shadow: 0 0 4px #eab308;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="map"></div>
    <div id="counter-badge" class="tracker-counter">
        <span style="width: 10px; height: 10px; background-color: #38bdf8; border-radius: 50%; display: inline-block;"></span>
        <span>Caricamento telemetria in corso...</span>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Inizializzazione mappa senza forzare il reset dello zoom impostato dall'utente
        const map = L.map('map', {
            zoomControl: false,
            maxZoom: 19
        }).setView([42.5, 12.5], 7);

        L.control.zoom({ position: 'topright' }).addTo(map);

        // Tile base Esri
        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'Tiles &copy; Esri &mdash; Source: Esri, DeLorme, NAVTEQ, USGS, Intermap, iPC, NRCAN, Esri Japan, METI, Esri China (Hong Kong), Esri (Thailand), TomTom, 2012',
            maxZoom: 19,
            maxNativeZoom: 16
        }).addTo(map);

        // Caricamento tile radar di sfondo
        fetch('https://api.rainviewer.com/public/weather-maps.json')
            .then(res => res.json())
            .then(data => {
                if (data.radar && data.radar.past && data.radar.past.length > 0) {
                    const latestRadar = data.radar.past[data.radar.past.length - 1];
                    L.tileLayer(`${data.host}${latestRadar.path}/256/{z}/{x}/{y}/2/1_1.png`, {
                        opacity: 0.55,
                        zIndex: 200,
                        attribution: '&copy; RainViewer'
                    }).addTo(map);
                }
            })
            .catch(err => console.log("Errore tile radar:", err));

        const stormLayerGroup = L.layerGroup().addTo(map);

        function loadStormCells() {
            const jsonUrl = 'storm_cells.json?t=' + new Date().getTime();
            
            fetch(jsonUrl)
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`File JSON non trovato (${response.status})`);
                    }
                    return response.json();
                })
                .then(data => {
                    if (!data.macro_structures) {
                        throw new Error("Struttura JSON non valida");
                    }

                    const count = data.macro_structures.length;
                    document.getElementById('counter-badge').innerHTML = `
                        <span style="width: 10px; height: 10px; background-color: #22c55e; border-radius: 50%; display: inline-block;"></span>
                        <span>Storm Tracker: <b>${count}</b> celle attive</span>
                    `;

                    stormLayerGroup.clearLayers();

                    data.macro_structures.forEach(cell => {
                        const dbzShort = cell.intensity ? cell.intensity.split(' ')[0] + ' dBZ' : '';
                        const shortType = cell.convective_type ? cell.convective_type.split(' ')[0] : 'Cella';

                        // Marker ingrandito per garantire la massima visibilità delle celle 3D su smartphone
                        const profileIcon = L.divIcon({
                            className: 'custom-storm-marker',
                            html: `
                                <div style="text-align: center; pointer-events: auto; cursor: pointer;">
                                    <img src="${cell.profile_image}" style="width: 120px; height: 75px; display: block; margin: 0 auto; filter: drop-shadow(0px 4px 10px rgba(0,0,0,0.85)); image-rendering: crisp-edges;" alt="${cell.id}">
                                    <div style="background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(4px); color: #f8fafc; padding: 4px 8px; font-size: 11px; font-family: monospace; border-radius: 6px; border: 1px solid rgba(56, 189, 248, 0.5); box-shadow: c0 4px 8px rgba(0,0,0,0.6); white-space: nowrap; text-align: left; margin-top: 2px;">
                                        <div style="font-weight: bold; color: #38bdf8; display: flex; justify-content: space-between; gap: 8px;">
                                            <span>${cell.id}</span>
                                            <span style="color: #facc15;">${dbzShort}</span>
                                        </div>
                                        <div style="font-size: 9.5px; color: #94a3b8; border-top: 1px solid rgba(255,255,255,0.15); margin-top: 3px; padding-top: 2px;">
                                            ${shortType} • ${cell.speed_kmh} km/h
                                        </div>
                                    </div>
                                </div>
                            `,
                            iconSize: [130, 115],
                            iconAnchor: [65, 115]
                        });

                        const marker = L.marker(cell.center, { icon: profileIcon });

                        // Vettore storico effettivo (bl
