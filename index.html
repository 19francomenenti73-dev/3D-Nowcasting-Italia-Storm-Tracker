<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <title>Nowcasting Italia - 3D Convective Tracker</title>
  <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no" />
  <script src="https://api.mapbox.com/mapbox-gl-js/v3.0.1/mapbox-gl.js"></script>
  <link href="https://api.mapbox.com/mapbox-gl-js/v3.0.1/mapbox-gl.css" rel="stylesheet" />
  <style>
    body { margin: 0; padding: 0; background: #090d16; font-family: system-ui, -apple-system, sans-serif; }
    #map { position: absolute; top: 0; bottom: 0; width: 100%; height: 100%; }
    
    #ui-panel {
      position: absolute;
      top: 12px;
      right: 12px;
      z-index: 10;
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid #334155;
      color: #38bdf8;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: bold;
      box-shadow: 0 4px 6px rgba(0,0,0,0.4);
    }

    .mapboxgl-popup-content {
      background: #0f172a !important;
      color: #f8fafc !important;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 12px;
      font-size: 12px;
    }
    .mapboxgl-popup-anchor-bottom .mapboxgl-popup-tip { border-top-color: #0f172a !important; }
    .pop-title { color: #f43f5e; font-weight: bold; font-size: 13px; border-bottom: 1px solid #334155; padding-bottom: 4px; margin-bottom: 6px; }
    .pop-row { display: flex; justify-content: space-between; margin: 3px 0; gap: 12px; }
    .pop-lbl { color: #94a3b8; }
    .pop-val { font-weight: bold; color: #38bdf8; }
  </style>
</head>
<body>

<div id="ui-panel">Nowcasting 3D: Sincronizzazione...</div>
<div id="map"></div>

<script>
  // Access Token pubblico Mapbox per rendering WebGL 3D
  mapboxgl.accessToken = 'pk.eyJ1IjoibWFwYm94IiwiYSI6ImNpejY4M29iazA2Z2gycXA4N2pmbDZmangifQ.-g_vE53SD2WrJ6tFX7QHmA';

  var map = new mapboxgl.Map({
    container: 'map',
    style: 'mapbox://styles/mapbox/dark-v11',
    center: [12.50, 42.00],
    zoom: 6.5,
    pitch: 50, // Inclinazione prospettica 3D della mappa
    bearing: -5
  });

  map.addControl(new mapboxgl.NavigationControl());

  var dataUrl = 'https://raw.githubusercontent.com/19francomenenti73-dev/3D-Nowcasting-Italia-Storm-Tracker/main/storm_cells.json';

  map.on('load', function () {
    fetchTracker3D();
    setInterval(fetchTracker3D, 60000);
  });

  function fetchTracker3D() {
    fetch(dataUrl + '?v=' + Date.now())
      .then(res => res.json())
      .then(data => {
        var cells = data.cells || [];
        document.getElementById('ui-panel').innerHTML = `Celle 3D Attive (≥32 dBZ): ${cells.length}`;

        // Pulizia layer precedenti
        ['cells-3d-extrusion', 'cells-vectors-blue', 'cells-vectors-red'].forEach(layer => {
          if (map.getLayer(layer)) map.removeLayer(layer);
        });
        if (map.getSource('cells-geojson')) map.removeSource('cells-geojson');
        if (map.getSource('vectors-geojson')) map.removeSource('vectors-geojson');

        var cellFeatures = [];
        var vectorFeatures = [];

        cells.forEach(cell => {
          if (!cell.poly_base || cell.poly_base.length < 3) return;

          var ringBase = cell.poly_base.map(pt => [pt[1], pt[0]]);
          ringBase.push(ringBase[0]);

          var color = cell.max_dbz >= 50 ? '#ef4444' : (cell.max_dbz >= 42 ? '#f97316' : '#22c55e');
          var extrusionHeight = (cell.echo_top_km || 10) * 800; // Altezza colonna 3D in metri

          // Feature Poligono 3D
          cellFeatures.push({
            'type': 'Feature',
            'properties': {
              'id': cell.id,
              'dbz': cell.max_dbz,
              'color': color,
              'height': extrusionHeight,
              'base_height': 0,
              'eta': cell.eta_target,
              'stage': cell.stage,
              'wind': cell.wind_speed_kmh,
              'hail': cell.hail_probability,
              'vil': cell.vil,
              'top_km': cell.echo_top_km
            },
            'geometry': {
              'type': 'Polygon',
              'coordinates': [ringBase]
            }
          });

          // Vettore Blu (Avanzamento effettivo 10 min)
          if (cell.movement_vector) {
            vectorFeatures.push({
              'type': 'Feature',
              'properties': { 'type': 'blue' },
              'geometry': {
                'type': 'LineString',
                'coordinates': [[cell.movement_vector[0][1], cell.movement_vector[0][0]], [cell.movement_vector[1][1], cell.movement_vector[1][0]]]
              }
            });
          }

          // Vettore Rosso (Previsionale)
          if (cell.predictive_vector) {
            vectorFeatures.push({
              'type': 'Feature',
              'properties': { 'type': 'red' },
              'geometry': {
                'type': 'LineString',
                'coordinates': [[cell.predictive_vector[0][1], cell.predictive_vector[0][0]], [cell.predictive_vector[1][1], cell.predictive_vector[1][0]]]
              }
            });
          }
        });

        // Add Poligoni 3D
        map.addSource('cells-geojson', {
          'type': 'geojson',
          'data': { 'type': 'FeatureCollection', 'features': cellFeatures }
        });

        map.addLayer({
          'id': 'cells-3d-extrusion',
          'type': 'fill-extrusion',
          'source': 'cells-geojson',
          'paint': {
            'fill-extrusion-color': ['get', 'color'],
            'fill-extrusion-height': ['get', 'height'],
            'fill-extrusion-base': ['get', 'base_height'],
            'fill-extrusion-opacity': 0.65
          }
        });

        // Add Vettori
        map.addSource('vectors-geojson', {
          'type': 'geojson',
          'data': { 'type': 'FeatureCollection', 'features': vectorFeatures }
        });

        map.addLayer({
          'id': 'cells-vectors-blue',
          'type': 'line',
          'source': 'vectors-geojson',
          'filter': ['==', ['get', 'type'], 'blue'],
          'paint': { 'line-color': '#2563eb', 'line-width': 4 }
        });

        map.addLayer({
          'id': 'cells-vectors-red',
          'type': 'line',
          'source': 'vectors-geojson',
          'filter': ['==', ['get', 'type'], 'red'],
          'paint': { 'line-color': '#dc2626', 'line-width': 3, 'line-dasharray': [2, 2] }
        });

        // Popup Dati al Click
        map.on('click', 'cells-3d-extrusion', function (e) {
          var props = e.features[0].properties;
          new mapboxgl.Popup()
            .setLngLat(e.lngLat)
            .setHTML(`
              <div class="pop-title">Cella ID: ${props.id}</div>
              <div class="pop-row"><span class="pop-lbl">ETA Bersaglio:</span> <span class="pop-val" style="color:#f43f5e">${props.eta}</span></div>
              <div class="pop-row"><span class="pop-lbl">Maturità:</span> <span class="pop-val">${props.stage}</span></div>
              <div class="pop-row"><span class="pop-lbl">Riflettività:</span> <span class="pop-val">${props.dbz} dBZ</span></div>
              <div class="pop-row"><span class="pop-lbl">Velocità Vento:</span> <span class="pop-val">${props.wind} km/h</span></div>
              <div class="pop-row"><span class="pop-lbl">Echo Top:</span> <span class="pop-val">${props.top_km} km</span></div>
              <div class="pop-row"><span class="pop-lbl">VIL:</span> <span class="pop-val">${props.vil} kg/m²</span></div>
              <div class="pop-row"><span class="pop-lbl">Prob. Grandine:</span> <span class="pop-val">${props.hail}%</span></div>
            `)
            .addTo(map);
        });
      })
      .catch(err => {
        document.getElementById('ui-panel').innerHTML = "Errore sync JSON";
      });
  }
</script>
</body>
</html>
