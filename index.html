<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <title>Nowcasting Italia - 3D Storm Tracker</title>
  <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no" />
  <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
  <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #090d16; overflow: hidden; font-family: system-ui, -apple-system, sans-serif; }
    #map { width: 100%; height: 100%; position: absolute; }
    #ui-panel {
      position: absolute; top: 10px; right: 10px; z-index: 10;
      background: rgba(15, 23, 42, 0.92); border: 1px solid #334155; color: #38bdf8;
      padding: 6px 10px; border-radius: 6px; font-size: 11px; font-weight: bold;
      box-shadow: 0 4px 6px rgba(0,0,0,0.4);
    }
  </style>
</head>
<body>

<div id="ui-panel">Caricamento in corso...</div>
<div id="map"></div>

<script>
  var map = new maplibregl.Map({
    container: 'map',
    style: 'https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json',
    center: [12.50, 42.00],
    zoom: 6.0,
    pitch: 45,
    bearing: -5,
    failIfMajorPerformanceCaveat: false
  });

  map.addControl(new maplibregl.NavigationControl());

  map.on('load', function () {
    fetchAndRender();
    setInterval(fetchAndRender, 30000);
  });

  function fetchAndRender() {
    // Forziamo il bypass della cache chiedendo 'celle_tempestose.json'
    var jsonUrl = './celle_tempestose.json?v=' + Date.now();
    
    fetch(jsonUrl)
      .then(res => {
        if (!res.ok) throw new Error("HTTP " + res.status);
        return res.json();
      })
      .then(data => {
        var cellule = data.cellule || data.cells || [];
        var percorsoRadar = data.percorso_radar || data.radar_path;

        document.getElementById('ui-panel').innerHTML = `Celle 3D Attive (≥32 dBZ): ${cellule.length}`;
        renderLayers(cellule, percorsoRadar);
      })
      .catch(err => {
        document.getElementById('ui-panel').innerHTML = "Errore: " + err.message;
      });
  }

  function renderLayers(cellule, percorsoRadar) {
    ['cells-3d-walls', 'cells-3d-top', 'cells-vectors-blue', 'cells-vectors-red', 'centroid-green-circle', 'radar-tile-layer'].forEach(l => {
      if (map.getLayer(l)) map.removeLayer(l);
    });
    ['cells-src', 'vectors-src', 'centroids-src', 'radar-tile-source'].forEach(s => {
      if (map.getSource(s)) map.removeSource(s);
    });

    if (percorsoRadar) {
      map.addSource('radar-tile-source', {
        'type': 'raster',
        'tiles': ['https://tile.rainviewer.com' + percorsoRadar + '/256/{z}/{x}/{y}/2/1_1.png'],
        'tileSize': 256
      });
      map.addLayer({
        'id': 'radar-tile-layer',
        'type': 'raster',
        'source': 'radar-tile-source',
        'paint': { 'raster-opacity': 0.65 }
      });
    }

    if (!cellule || cellule.length === 0) return;

    var cellFeatures = [];
    var vectorFeatures = [];
    var centroidFeatures = [];

    cellule.forEach(cell => {
      var rawPoly = cell.contorno_reale || cell.contour_real || cell.poly_base;
      if (!rawPoly || rawPoly.length < 3) return;

      var ring = rawPoly.map(pt => [pt[1], pt[0]]);
      ring.push(ring[0]);

      var dbz = cell.max_dbz || 35;
      var color = dbz >= 50 ? '#ef4444' : (dbz >= 42 ? '#f97316' : '#22c55e');
      var topHeight = ((cell.echo_top_km || 8) * 800);

      cellFeatures.push({
        'type': 'Feature',
        'properties': {
          'id': cell.id || 'TC',
          'color': color,
          'height': topHeight,
          'dbz': dbz
        },
        'geometry': { 'type': 'Polygon', 'coordinates': [ring] }
      });

      var vecMov = cell.vettore_movimento || cell.movement_vector;
      if (vecMov && vecMov.length === 2) {
        vectorFeatures.push({
          'type': 'Feature',
          'properties': { 'type': 'blue' },
          'geometry': {
            'type': 'LineString',
            'coordinates': [[vecMov[0][1], vecMov[0][0]], [vecMov[1][1], vecMov[1][0]]]
          }
        });
      }

      var vecPred = cell.vettore_predittivo || cell.predictive_vector;
      if (vecPred && vecPred.length === 2) {
        vectorFeatures.push({
          'type': 'Feature',
          'properties': { 'type': 'red' },
          'geometry': {
            'type': 'LineString',
            'coordinates': [[vecPred[0][1], vecPred[0][0]], [vecPred[1][1], vecPred[1][0]]]
          }
        });
      }

      var centroide = cell.centroide || cell.centroid;
      if (centroide) {
        centroidFeatures.push({
          'type': 'Feature',
          'properties': { 'id': cell.id || 'TC' },
          'geometry': { 'type': 'Point', 'coordinates': [centroide[1], centroide[0]] }
        });
      }
    });

    if (cellFeatures.length > 0) {
      map.addSource('cells-src', { 'type': 'geojson', 'data': { 'type': 'FeatureCollection', 'features': cellFeatures } });
      map.addLayer({
        'id': 'cells-3d-walls',
        'type': 'fill-extrusion',
        'source': 'cells-src',
        'paint': {
          'fill-extrusion-color': '#64748b',
          'fill-extrusion-height': ['get', 'height'],
          'fill-extrusion-base': 0,
          'fill-extrusion-opacity': 0.35
        }
      });
      map.addLayer({
        'id': 'cells-3d-top',
        'type': 'fill-extrusion',
        'source': 'cells-src',
        'paint': {
          'fill-extrusion-color': ['get', 'color'],
          'fill-extrusion-height': ['get', 'height'],
          'fill-extrusion-base': ['-', ['get', 'height'], 200],
          'fill-extrusion-opacity': 0.85
        }
      });
    }

    if (vectorFeatures.length > 0) {
      map.addSource('vectors-src', { 'type': 'geojson', 'data': { 'type': 'FeatureCollection', 'features': vectorFeatures } });
      map.addLayer({
        'id': 'cells-vectors-blue',
        'type': 'line',
        'source': 'vectors-src',
        'filter': ['==', ['get', 'type'], 'blue'],
        'paint': { 'line-color': '#2563eb', 'line-width': 4 }
      });
      map.addLayer({
        'id': 'cells-vectors-red',
        'type': 'line',
        'source': 'vectors-src',
        'filter': ['==', ['get', 'type'], 'red'],
        'paint': { 'line-color': '#dc2626', 'line-width': 3, 'line-dasharray': [2, 2] }
      });
    }

    if (centroidFeatures.length > 0) {
      map.addSource('centroids-src', { 'type': 'geojson', 'data': { 'type': 'FeatureCollection', 'features': centroidFeatures } });
      map.addLayer({
        'id': 'centroid-green-circle',
        'type': 'circle',
        'source': 'centroids-src',
        'paint': {
          'circle-radius': 10,
          'circle-color': 'rgba(0,0,0,0)',
          'circle-stroke-width': 3,
          'circle-stroke-color': '#22c55e'
        }
      });
    }
  }
</script>
</body>
</html>
