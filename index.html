<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    html, body, #map { width: 100%; height: 100%; margin: 0; padding: 0; background: #111; }
    
    #status-box {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 1000;
      background: rgba(15, 23, 42, 0.9);
      color: #38bdf8;
      padding: 6px 10px;
      font-family: system-ui, sans-serif;
      font-size: 11px;
      font-weight: bold;
      border-radius: 4px;
      border: 1px solid #334155;
    }

    /* Centroide Verde Pulsante */
    .pulsing-centroid {
      width: 14px;
      height: 14px;
      background: #22c55e;
      border: 2px solid #ffffff;
      border-radius: 50%;
      box-shadow: 0 0 0 rgba(34, 197, 94, 0.6);
      animation: pulse-animation 1.5s infinite;
    }
    @keyframes pulse-animation {
      0% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7); }
      70% { box-shadow: 0 0 0 10px rgba(34, 197, 94, 0); }
      100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
    }

    /* Stile Popup */
    .leaflet-popup-content-wrapper {
      background: #0f172a;
      color: #f8fafc;
      font-family: system-ui, sans-serif;
      font-size: 12px;
      border-radius: 6px;
      border: 1px solid #334155;
    }
    .leaflet-popup-tip { background: #0f172a; }
    .pop-title { color: #f43f5e; font-size: 13px; font-weight: bold; border-bottom: 1px solid #334155; padding-bottom: 3px; margin-bottom: 5px; }
    .pop-row { display: flex; justify-content: space-between; margin: 2px 0; }
    .pop-lbl { color: #94a3b8; }
    .pop-val { font-weight: bold; color: #38bdf8; }
  </style>
</head>
<body>

<div id="status-box">Tracker attivo</div>
<div id="map"></div>

<script>
  var map = L.map('map', { zoomControl: true }).setView([42.50, 12.50], 6);

  // Mappa base OpenStreetMap pulita e stabile (Zero API Key)
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 11,
    minZoom: 5,
    attribution: '&copy; OpenStreetMap'
  }).addTo(map);

  var dataUrl = 'https://raw.githubusercontent.com/19francomenenti73-dev/3D-Nowcasting-Italia-Storm-Tracker/main/storm_cells.json';

  function getRadarColor(dbz) {
    if (dbz >= 55) return '#7f1d1d';
    if (dbz >= 48) return '#ef4444';
    if (dbz >= 40) return '#f97316';
    if (dbz >= 35) return '#eab308';
    return '#22c55e';
  }

  function loadTrackerData() {
    fetch(dataUrl + '?v=' + Date.now())
      .then(res => res.json())
      .then(data => {
        var cells = data.cells || [];
        document.getElementById('status-box').innerHTML = `Celle attive: ${cells.length}`;

        cells.forEach(cell => {
          if (!cell.polygon || cell.polygon.length < 3) return;

          var maxDbz = cell.max_dbz;
          var color = getRadarColor(maxDbz);
          var centroid = cell.centroid;

          // 1. PROIEZIONE 3D IN GRIGIO TRASPARENTE (Base inferiore)
          if (cell.polygon_3d_base) {
            L.polygon(cell.polygon_3d_base, {
              color: '#64748b',
              weight: 1,
              opacity: 0.3,
              fillColor: '#475569',
              fillOpacity: 0.15
            }).addTo(map);
          }

          // 2. CELLA RADAR REALE SUPERIORE (Solo bordo non pieno + trasparenza interna minima)
          var radarPolygon = L.polygon(cell.polygon, {
            color: color,
            weight: 2,
            opacity: 0.9,
            fillColor: color,
            fillOpacity: 0.25
          }).addTo(map);

          // 3. VETTORE BLU REALE (Movimento effettivo a 10 minuti)
          if (cell.movement_vector) {
            L.polyline(cell.movement_vector, {
              color: '#3b82f6',
              weight: 3,
              opacity: 0.85
            }).addTo(map);
          }

          // 4. LINEA ROSSA TRATTEGGIATA (Previsionale dal tracker)
          if (cell.predictive_vector) {
            L.polyline(cell.predictive_vector, {
              color: '#ef4444',
              weight: 2,
              dashArray: '5, 5',
              opacity: 0.9
            }).addTo(map);
          }

          // 5. CENTROIDE VERDE PULSANTE & POPUP INTERATTIVO
          var pulsingIcon = L.divIcon({
            className: 'pulsing-centroid',
            iconSize: [14, 14],
            iconAnchor: [7, 7]
          });

          var popupContent = `
            <div class="pop-title">ID Cella: ${cell.id}</div>
            <div class="pop-row"><span class="pop-lbl">ETA Bersaglio:</span> <span class="pop-val" style="color:#f43f5e">${cell.eta_target}</span></div>
            <div class="pop-row"><span class="pop-lbl">Stadio:</span> <span class="pop-val">${cell.stage}</span></div>
            <div class="pop-row"><span class="pop-lbl">Max dBZ:</span> <span class="pop-val">${maxDbz} dBZ</span></div>
            <div class="pop-row"><span class="pop-lbl">Velocità Vento:</span> <span class="pop-val">${cell.wind_speed_kmh} km/h</span></div>
            <div class="pop-row"><span class="pop-lbl">Echo Top:</span> <span class="pop-val">${cell.echo_top_km} km</span></div>
            <div class="pop-row"><span class="pop-lbl">VIL:</span> <span class="pop-val">${cell.vil} kg/m²</span></div>
            <div class="pop-row"><span class="pop-lbl">Prob. Grandine:</span> <span class="pop-val">${cell.hail_probability}%</span></div>
          `;

          L.marker(centroid, { icon: pulsingIcon })
            .addTo(map)
            .bindPopup(popupContent);
        });
      })
      .catch(err => {
        document.getElementById('status-box').innerHTML = "Errore sync dati";
      });
  }

  loadTrackerData();
  setInterval(loadTrackerData, 60000); // Aggiornamento automatico ogni minuto
</script>
</body>
</html>
