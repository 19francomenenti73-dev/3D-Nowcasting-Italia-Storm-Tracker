<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nowcasting Italia - Multi-Risk & 3D Storm Tracker</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0f172a;
        }
        #map {
            width: 100%;
            height: 100%;
            background-color: #0f172a;
        }
        .tracker-counter {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            background: rgba(255, 255, 255, 0.95);
            padding: 10px 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            font-weight: bold;
            font-size: 13px;
            color: #1e293b;
            display: flex;
            align-items: center;
            gap: 8px;
            border: 1px solid rgba(0,0,0,0.1);
        }
        .custom-storm-badge {
            background: rgba(15, 23, 42, 0.9);
            color: #38bdf8;
            padding: 3px 8px;
            font-size: 11px;
            font-weight: bold;
            border-radius: 6px;
            border: 1px solid rgba(56, 189, 248, 0.5);
            white-space: nowrap;
            box-shadow: 0 2px 6px rgba(0,0,0,0.4);
            text-align: center;
        }
        
        /* Animazioni e stili per i Terremoti */
        @keyframes quakeFlash {
            0% { transform: scale(1); opacity: 1; box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.8); }
            70% { transform: scale(1.3); opacity: 0.7; box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
            100% { transform: scale(1); opacity: 1; box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
        .quake-active-flash {
            background-color: #ef4444;
            border-radius: 50%;
            width: 16px;
            height: 16px;
            border: 2px solid #ffffff;
            animation: quakeFlash 1.5s infinite;
        }
        .quake-aged {
            background-color: #f97316;
            border-radius: 50%;
            width: 8px;
            height: 8px;
            border: 1px solid #ffffff;
        }
        .lightning-icon {
            background: transparent;
            font-size: 14px;
            text-shadow: 0 0 4px #eab308;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="map"></div>
    <div id="counter-badge" class="tracker-counter">
        <span>Inizializzazione Multi-Risk Dashboard...</span>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map', {
            zoomControl: false
        }).setView([42.0, 12.5], 6);

        L.control.zoom({ position: 'topright' }).addTo(map);

        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'Tiles &copy; Esri &mdash; Source: Esri, DeLorme, NAVTEQ, USGS, Intermap, iPC, NRCAN, Esri Japan, METI, Esri China (Hong Kong), Esri (Thailand), TomTom, 2012',
            maxZoom: 18
        }).addTo(map);

        // Caricamento tile radar di sfondo in tempo reale
        fetch('https://api.rainviewer.com/public/weather-maps.json')
            .then(res => res.json())
            .then(data => {
                if (data.radar && data.radar.past && data.radar.past.length > 0) {
                    const latestRadar = data.radar.past[data.radar.past.length - 1];
                    L.tileLayer(`${data.host}${latestRadar.path}/256/{z}/{x}/{y}/2/1_1.png`, {
                        opacity: 0.55,
                        zIndex: 200,
                        attribution: '&copy; RainViewer'
                    }).addTo(map);
                }
            })
            .catch(err => console.log("Errore tile radar:", err));

        // Caricamento Celle Tempestose (Poligoni, Tracce, Vettori e Centroidi)
        function loadStormCells() {
            const jsonUrl = 'storm_cells.json?t=' + new Date().getTime();
            
            fetch(jsonUrl)
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`File JSON non trovato (${response.status})`);
                    }
                    return response.json();
                })
                .then(data => {
                    if (!data.cells) {
                        throw new Error("Struttura JSON non valida (chiave 'cells' mancante)");
                    }

                    const count = data.cells.length;
                    document.getElementById('counter-badge').innerHTML = `
                        <span style="width: 10px; height: 10px; background-color: #22c55e; border-radius: 50%; display: inline-block;"></span>
                        Storm Tracker: <b>${count}</b> celle attive
                    `;

                    data.cells.forEach(cell => {
                        const centroid = cell.centroid; // [lat, lon]

                        // 1. Disegno del poligono perimetrale della cella
                        if (cell.polygon && cell.polygon.length > 0) {
                            L.polygon(cell.polygon, {
                                color: '#ef4444',
                                fillColor: '#ef4444',
                                fillOpacity: 0.12,
                                weight: 1.5,
                                dashArray: '3, 3'
                            }).addTo(map);
                        }

                        // 2. Tracciato storico (History Track)
                        if (cell.history_track && cell.history_track.length > 0) {
                            L.polyline(cell.history_track, {
                                color: '#38bdf8',
                                weight: 2.5,
                                dashArray: '4, 4',
                                opacity: 0.7
                            }).addTo(map);
                        }

                        // 3. Vettore previsionale (Predictive Vector)
                        if (cell.predictive_vector && cell.predictive_vector.length === 2) {
                            L.polyline([centroid, cell.predictive_vector], {
                                color: '#22c55e',
                                weight: 3.5,
                                opacity: 0.9
                            }).addTo(map);
                        }

                        // 4. Centroid Badge Marker
                        const badgeIcon = L.divIcon({
                            className: 'custom-storm-marker',
                            html: `<div class="custom-storm-badge">⚡ ${cell.id}</div>`,
                            iconSize: [80, 24],
                            iconAnchor: [40, 12]
                        });

                        const marker = L.marker(centroid, { icon: badgeIcon }).addTo(map);

                        // 5. Popup Telemetria Avanzata
                        const popupContent = `
                            <div style="font-family: sans-serif; font-size: 12px; line-height: 1.4; color: #1e293b; min-width: 220px;">
                                <b style="font-size: 13px; color: #0f172a;">Cellula:</b> ${cell.id}<br>
                                <b>Stadio:</b> <span style="color: #2563eb; font-weight: bold;">${cell.stage}</span><br>
                                <b>Riflettività Max:</b> <span style="color: #dc2626; font-weight: bold;">${cell.max_dbz} dBZ</span><br>
                                <b>Rain Rate:</b> <span style="color: #0284c7; font-weight: bold;">${cell.rain_rate} mm/h</span><br>
                                <b>Prob. Grandine:</b> <span style="color: ${cell.hail_probability > 50 ? '#dc2626' : '#16a34a'}; font-weight: bold;">${cell.hail_probability}%</span><br>
                                <b>Attività Fulmini:</b> ${cell.flash_rate}<br>
                                <b>Velocità:</b> ${cell.speed_kmh} km/h<br>
                                <b>Echo Top:</b> ${cell.echo_top_km} km<br>
                                <b>VIL:</b> ${cell.vil} kg/m²<br>
                                <b>ETA Roma:</b> <span style="color: #d97706; font-weight: bold;">${cell.eta_rome_min} min</span><br>
                                <hr style="margin: 4px 0; border: none; border-top: 1px solid #cbd5e1;">
                                <span style="font-size: 10px; color: #64748b;">Raggio stimato: ${cell.radius_km} km</span>
                            </div>
                        `;
                        marker.bindPopup(popupContent);
                    });
                })
                .catch(error => {
                    console.error("Errore di caricamento celle:", error);
                    document.getElementById('counter-badge').innerHTML = `
                        <span style="width: 10px; height: 10px; background-color: #ef4444; border-radius: 50%; display: inline-block;"></span>
                        <b style="color: #dc2626;">Errore JSON:</b> ${error.message}
                    `;
                });
        }

        // Caricamento Terremoti (M >= 3.5: lampeggiante 1 ora, rimpicciolito attivo fino a 24 ore)
        function loadEarthquakes() {
            fetch('https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/all_day.geojson')
                .then(res => res.json())
                .then(data => {
                    const now = new Date().getTime();
                    data.features.forEach(quake => {
                        const mag = quake.properties.mag;
                        const time = quake.properties.time;
                        const place = quake.properties.place;
                        const depth = quake.geometry.coordinates[2];
                        const coords = [quake.geometry.coordinates[1], quake.geometry.coordinates[0]];
                        
                        const diffHours = (now - time) / (1000 * 60 * 60);

                        if (mag >= 3.5 && diffHours <= 24) {
                            let iconClass = 'quake-aged';
                            let iconSize = [8, 8];
                            let iconAnchor = [4, 4];

                            if (diffHours <= 1) {
                                iconClass = 'quake-active-flash';
                                iconSize = [16, 16];
                                iconAnchor = [8, 8];
                            }

                            const quakeIcon = L.divIcon({
                                className: iconClass,
                                iconSize: iconSize,
                                iconAnchor: iconAnchor
                            });

                            const marker = L.marker(coords, { icon: quakeIcon }).addTo(map);
                            const timeAgoMin = Math.round(diffHours * 60);

                            marker.bindPopup(`
                                <div style="font-family: sans-serif; font-size: 12px; line-height: 1.4; color: #1e293b; min-width: 190px;">
                                    <b style="color: #dc2626; font-size: 13px;">⚠️ EVENTO SISMICO</b><br>
                                    <b>Magnitudo:</b> M ${mag.toFixed(1)}<br>
                                    <b>Località:</b> ${place}<br>
                                    <b>Profondità:</b> ${depth} km<br>
                                    <b>Registrato:</b> ${timeAgoMin <= 60 ? timeAgoMin + ' min fa' : Math.round(diffHours) + ' ore fa'}<br>
                                    <span style="font-size: 10px; color: #64748b;">Soglia M ≥ 3.5 (Open Data)</span>
                                </div>
                            `);
                        }
                    });
                })
                .catch(err => console.log("Errore dati sismici:", err));
        }

        // Stream Fulmini in tempo reale (Blitzortung WebSocket)
        function initLightningStream() {
            try {
                const ws = new WebSocket('wss://ws1.blitzortung.org:3000/');
                ws.onopen = function() {
                    ws.send(JSON.stringify({a: 111}));
                };
                ws.onmessage = function(event) {
                    try {
                        const pkt = JSON.parse(event.data);
                        if (pkt && pkt.lat && pkt.lon) {
                            const lIcon = L.divIcon({
                                className: 'lightning-icon',
                                html: '⚡',
                                iconSize: [14, 14],
                                iconAnchor: [7, 7]
                            });
                            const lMarker = L.marker([pkt.lat, pkt.lon], { icon: lIcon }).addTo(map);
                            setTimeout(() => {
                                map.removeLayer(lMarker);
                            }, 900000); // Scompare dopo 15 minuti
                        }
                    } catch(e) {}
                };
                ws.onerror = function() {
                    console.log("Stream fulmini in standby");
                };
            } catch(e) {
                console.log("Modulo fulmini non inizializzato");
            }
        }

        // Avvio moduli
        loadStormCells();
        loadEarthquakes();
        initLightningStream();

        // Polling automatico ogni 5 minuti per aggiornare la mappa senza ricaricare la pagina
        setInterval(() => {
            loadStormCells();
        }, 300000);
    </script>
</body>
</html>
