<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nowcasting Italia - 3D Storm Tracker & Multi-Risk Dashboard</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0f172a;
        }
        #map {
            width: 100%;
            height: 100%;
            background-color: #0f172a;
        }
        .tracker-counter {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            background: rgba(255, 255, 255, 0.95);
            padding: 10px 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            font-weight: bold;
            font-size: 13px;
            color: #1e293b;
            display: flex;
            align-items: center;
            gap: 8px;
            border: 1px solid rgba(0,0,0,0.1);
        }
        .custom-storm-marker {
            background: transparent;
            border: none;
        }
        
        /* Animazioni e stili per i Terremoti */
        @keyframes quakeFlash {
            0% { transform: scale(1); opacity: 1; box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.8); }
            70% { transform: scale(1.3); opacity: 0.7; box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
            100% { transform: scale(1); opacity: 1; box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
        .quake-active-flash {
            background-color: #ef4444;
            border-radius: 50%;
            width: 16px;
            height: 16px;
            border: 2px solid #ffffff;
            animation: quakeFlash 1.5s infinite;
        }
        .quake-aged {
            background-color: #f97316;
            border-radius: 50%;
            width: 8px;
            height: 8px;
            border: 1px solid #ffffff;
        }
        .lightning-icon {
            background: transparent;
            font-size: 14px;
            text-shadow: 0 0 4px #eab308;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="map"></div>
    <div id="counter-badge" class="tracker-counter">
        <span>Inizializzazione in corso...</span>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        try {
            const badge = document.getElementById('counter-badge');

            if (typeof L === 'undefined') {
                throw new Error("Libreria Leaflet non caricata correttamente.");
            }

            const map = L.map('map', {
                zoomControl: false
            }).setView([42.5, 12.5], 6);

            L.control.zoom({ position: 'topright' }).addTo(map);

            // Mappa di base stradale / orografica
            L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
                attribution: 'Tiles &copy; Esri',
                maxZoom: 18
            }).addTo(map);

            // Livello Satellitare in Trasparenza
            L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
                maxZoom: 18,
                opacity: 0.45
            }).addTo(map);

            // Caricamento tile radar di sfondo
            fetch('https://api.rainviewer.com/public/weather-maps.json')
                .then(res => res.json())
                .then(data => {
                    if (data.radar && data.radar.past && data.radar.past.length > 0) {
                        const latestRadar = data.radar.past[data.radar.past.length - 1];
                        L.tileLayer(`${data.host}${latestRadar.path}/256/{z}/{x}/{y}/2/1_1.png`, {
                            opacity: 0.55,
                            zIndex: 200
                        }).addTo(map);
                    }
                })
                .catch(err => console.log("Errore tile radar:", err));

            // Caricamento celle tempestose
            function loadStormCells() {
                const jsonUrl = 'celle_tempestose.json?t=' + new Date().getTime();
                
                fetch(jsonUrl)
                    .then(response => {
                        if (!response.ok) {
                            throw new Error(`File JSON non trovato (${response.status})`);
                        }
                        return response.json();
                    })
                    .then(data => {
                        const structures = data.macro_structures || [];
                        badge.innerHTML = `
                            <span style="width: 10px; height: 10px; background-color: #22c55e; border-radius: 50%; display: inline-block;"></span>
                            Storm Tracker: <b>${structures.length}</b> celle attive
                        `;

                        structures.forEach(cell => {
                            const profileIcon = L.divIcon({
                                className: 'custom-storm-marker',
                                html: `
                                    <div style="text-align: center; pointer-events: auto; cursor: pointer;">
                                        <img src="${cell.profile_image}" style="width: 80px; height: 48px; display: block; margin: 0 auto; filter: drop-shadow(0px 3px 6px rgba(0,0,0,0.6));" alt="${cell.id}">
                                        <span style="background: rgba(15, 23, 42, 0.9); color: #38bdf8; padding: 2px 7px; font-size: 10px; font-weight: bold; border-radius: 4px; border: 1px solid rgba(56, 189, 248, 0.4); white-space: nowrap;">
                                            ${cell.id}
                                        </span>
                                    </div>
                                `,
                                iconSize: [90, 70],
                                iconAnchor: [45, 70]
                            });

                            const marker = L.marker(cell.center, { icon: profileIcon }).addTo(map);

                            if (cell.actual_path && cell.actual_path.length > 0) {
                                L.polyline(cell.actual_path, { color: '#38bdf8', weight: 3, dashArray: '4, 4', opacity: 0.8 }).addTo(map);
                            }
                            if (cell.forecast_path && cell.forecast_path.length > 0) {
                                L.polyline(cell.forecast_path, { color: '#22c55e', weight: 4, opacity: 0.9 }).addTo(map);
                            }

                            L.circle(cell.center, {
                                radius: 20000,
                                color: '#22c55e',
                                fillColor: '#22c55e',
                                fillOpacity: 0.08,
                                weight: 1,
                                dashArray: '5, 5'
                            }).addTo(map);

                            const popupContent = `
                                <div style="font-family: sans-serif; font-size: 13px; line-height: 1.5; color: #1e293b; min-width: 220px;">
                                    <b style="font-size: 14px; color: #0f172a;">ID Cellula:</b> ${cell.id}<br>
                                    <b>Tipologia:</b> <span style="color: #2563eb; font-weight: bold;">${cell.convective_type}</span><br>
                                    <b>Intensità Picco:</b> <span style="color: #dc2626; font-weight: bold;">${cell.intensity}</span><br>
                                    <b>Velocità:</b> ${cell.speed_kmh} km/h<br>
                                    <b>Direzione:</b> ${cell.direction_deg}°<br>
                                </div>
                            `;
                            marker.bindPopup(popupContent);
                        });
                    })
                    .catch(error => {
                        console.warn("Avviso JSON:", error);
                        badge.innerHTML = `
                            <span style="width: 10px; height: 10px; background-color: #f59e0b; border-radius: 50%; display: inline-block;"></span>
                            <b>Storm Tracker:</b> Dashboard attiva (In attesa di celle_tempestose.json)
                        `;
                    });
            }

            // Caricamento Terremoti
            function loadEarthquakes() {
                fetch('https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/all_day.geojson')
                    .then(res => res.json())
                    .then(data => {
                        const now = new Date().getTime();
                        data.features.forEach(quake => {
                            const mag = quake.properties.mag;
                            const time = quake.properties.time;
                            const diffHours = (now - time) / (1000 * 60 * 60);

                            if (mag >= 3.5 && diffHours <= 24) {
                                let iconClass = diffHours <= 1 ? 'quake-active-flash' : 'quake-aged';
                                let iconSize = diffHours <= 1 ? [16, 16] : [8, 8];
                                let iconAnchor = diffHours <= 1 ? [8, 8] : [4, 4];

                                const quakeIcon = L.divIcon({
                                    className: iconClass,
                                    iconSize: iconSize,
                                    iconAnchor: iconAnchor
                                });

                                const marker = L.marker([quake.geometry.coordinates[1], quake.geometry.coordinates[0]], { icon: quakeIcon }).addTo(map);
                                marker.bindPopup(`<b>Terremoto M ${mag.toFixed(1)}</b><br>${quake.properties.place}`);
                            }
                        });
                    })
                    .catch(err => console.log("Errore dati sismici:", err));
            }

            // Avvio moduli
            loadStormCells();
            loadEarthquakes();

        } catch (err) {
            document.getElementById('counter-badge').innerHTML = `
                <span style="width: 10px; height: 10px; background-color: #ef4444; border-radius: 50%; display: inline-block;"></span>
                <b style="color: #dc2626;">Errore critico:</b> ${err.message}
            `;
        }
    </script>
</body>
</html>
