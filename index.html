<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    html, body, #map { width: 100%; height: 100%; margin: 0; padding: 0; background: #cfd8dc; }

    /* Animazione Impulso Elettrico sul Poligono della Cella */
    .lightning-polygon {
      animation: stormPulse 1.5s infinite ease-in-out;
    }
    @keyframes stormPulse {
      0%, 100% { fill-opacity: 0.35; stroke-width: 2; }
      50% { fill-opacity: 0.65; stroke-width: 3.5; stroke: #ffff00; }
    }
  </style>
</head>
<body>
<div id="map"></div>

<script>
  var map = L.map('map', { 
    zoomControl: true,
    tap: true
  }).setView([42.50, 9.50], 6);
  
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 18,
    attribution: '&copy; OpenStreetMap'
  }).addTo(map);

  // Radar RainViewer
  fetch('https://api.rainviewer.com/public/weather-maps.json')
    .then(r => r.json())
    .then(data => {
      if(data.radar && data.radar.past && data.radar.past.length > 0) {
        var lastPath = data.radar.past[data.radar.past.length - 1].path;
        L.tileLayer('https://tilecache.rainviewer.com' + lastPath + '/256/{z}/{x}/{y}/2/1_1.png', {
          opacity: 0.55,
          zIndex: 100
        }).addTo(map);
      }
    });

  // Caricamento Dati TITANS e generazione POLIGONI REALI
  fetch('https://19francomeneri73-dev.github.io/3D-Nowcasting-Italia-Storm-Tracker/storm_cells.json?v=' + Date.now())
    .then(r => r.json())
    .then(data => {
      if(data && data.cells && data.cells.length > 0) {
        drawRealCells(data.cells);
      }
    })
    .catch(e => console.log('In attesa di celle...'));

  function drawRealCells(cells) {
    cells.forEach(cell => {
      var lat = cell.centroid[0];
      var lon = cell.centroid[1];
      var radiusKm = cell.radius_km || 12; // Raggio reale in km dalla scansione
      var echoTop = cell.echo_top_km || 8;
      
      // Calcolo dei punti del perimetro reale della cella (12 vertici)
      var points = 12;
      var baseCoords = [];
      var topCoords = [];
      
      // Off-set prospettico in base all'Echo Top (simula lo sviluppo in altezza)
      var heightOffset = (echoTop * 0.003); 

      for (var i = 0; i < points; i++) {
        var angle = (i / points) * (2 * Math.PI);
        // Introduciamo una leggera irregolarità naturale al perimetro
        var varRadius = radiusKm * (0.85 + Math.sin(i * 3) * 0.15) / 111.32; 
        
        var dLat = varRadius * Math.cos(angle);
        var dLon = (varRadius * Math.sin(angle)) / Math.cos(lat * Math.PI / 180);
        
        baseCoords.push([lat + dLat, lon + dLon]);
        topCoords.push([lat + dLat + heightOffset, lon + dLon + (heightOffset * 0.5)]);
      }

      // 1. Base al suolo (Impronta della Cella)
      var basePolygon = L.polygon(baseCoords, {
        color: '#d32f2f',
        weight: 1.5,
        fillColor: '#b71c1c',
        fillOpacity: 0.25,
        dashArray: '3, 3'
      }).addTo(map);

      // 2. Sommità/Incudine (Estrusione 2.5D proporzionale all'Echo Top)
      var isElectric = (cell.flash_rate && cell.flash_rate > 0) || cell.max_dbz >= 45;
      var topPolygon = L.polygon(topCoords, {
        color: isElectric ? '#ffeb3b' : '#ff5722',
        weight: isElectric ? 2.5 : 1.8,
        fillColor: isElectric ? '#f44336' : '#d84315',
        fillOpacity: 0.5,
        className: isElectric ? 'lightning-polygon' : ''
      }).addTo(map);

      // 3. Linee di collegamento verticale (Spigoli della colonna convettiva)
      for (var j = 0; j < points; j += 3) {
        L.polyline([baseCoords[j], topCoords[j]], {
          color: '#ff9800',
          weight: 1,
          opacity: 0.6
        }).addTo(map);
      }

      // Popup tecnico con i parametri fisici reali
      var popupContent = `
        <div style="font-family: sans-serif; font-size: 11px;">
          <b style="color:#d32f2f; font-size:13px;">Cella ${cell.id}</b><br/>
          <b>Area/Raggio:</b> ~${radiusKm} km<br/>
          <b>Echo Top (Sviluppo Verticale):</b> ${echoTop} km<br/>
          <b>VIL:</b> ${cell.vil || '--'} kg/m²<br/>
          <b>Attività Elettrica:</b> ${isElectric ? '⚡ Attiva (Flash Rate alto)' : 'Assente'}
        </div>
      `;
      topPolygon.bindPopup(popupContent);
    });
  }
</script>
</body>
</html>
