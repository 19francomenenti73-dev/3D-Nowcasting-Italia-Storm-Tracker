<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Storm Tracker Europa</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        html, body, #map {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
        }
        .info-panel {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: white;
            padding: 10px 15px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            font-family: sans-serif;
            font-size: 14px;
            z-index: 1000;
            display: flex;
            gap: 10px;
            align-items: center;
        }
    </style>
</head>
<body>
    <div id="map"></div>
    <div class="info-panel" id="info-panel">
        <b>Storm Tracker Europa:</b> <span id="cell-count">0</span> celle attive
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map').setView([45.0, 10.0], 5);

        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'Tiles &copy; Esri'
        }).addTo(map);

        let cellsLayer = L.layerGroup().addTo(map);

        function getCardinalDirection(angle) {
            const directions = ['N', 'NNE', 'NE', 'ENE', 'E', 'ESE', 'SE', 'SSE', 'S', 'SSW', 'SW', 'WSW', 'W', 'WNW', 'NW', 'NNW'];
            const index = Math.round((angle % 360) / 22.5);
            return directions[index % 16];
        }

        async function loadStormCells() {
            try {
                let response = await fetch('storm_cells.json?' + new Date().getTime());
                let data = await response.json();
                
                cellsLayer.clearLayers();
                let structures = data.macro_structures || [];
                document.getElementById('cell-count').innerText = structures.length;

                if (data.radar_tile) {
                    let host = data.radar_tile.host;
                    let path = data.radar_tile.path;
                    L.tileLayer(`${host}${path}/256/{z}/{x}/{y}/2/1_1.png`, {
                        opacity: 0.6,
                        zIndex: 200
                    }).addTo(cellsLayer);
                }

                    structures.forEach(cell => {
                    let center = cell.center;
                    
                    // Vettore storico (Blu spesso)
                    if (cell.actual_path && cell.actual_path.length > 0) {
                        L.polyline(cell.actual_path, {
                            color: '#0055ff',
                            weight: 6,
                            opacity: 0.95
                        }).addTo(cellsLayer);
                    }

                    // Vettore predittivo (Rosso tratteggiato spesso)
                    if (cell.forecast_path && cell.forecast_path.length > 0) {
                        L.polyline(cell.forecast_path, {
                            color: '#ff0033',
                            weight: 6,
                            opacity: 0.95,
                            dashArray: '8, 12'
                        }).addTo(cellsLayer);
                    }

                    // Icona con il profilo 3D della cella direttamente sulla mappa
                    let cellIcon = L.icon({
                        iconUrl: cell.profile_image + '?' + new Date().getTime(),
                        iconSize: [53, 32],
                        iconAnchor: [26, 16]
                    });

                    let cardinalDir = getCardinalDirection(cell.direction_deg);
                    let popupContent = `
                        <div style="font-family: sans-serif; font-size: 13px; line-height: 1.5; min-width: 200px;">
                            <b>ID Cellula:</b> ${cell.id}<br>
                            <b>Intensità:</b> ${cell.intensity}<br>
                            <b>Velocità:</b> ${cell.speed_kmh} km/h<br>
                            <b>Direzione:</b> ${cardinalDir} (${cell.direction_deg}°)<br>
                            <b>Echo Top:</b> <span style="color: #d97706; font-weight: bold;">${cell.echo_top} km</span><br>
                            <b>VIL:</b> ${cell.vil} kg/m²
                        </div>
                    `;

                    L.marker([center[0], center[1]], { icon: cellIcon })
                        .bindPopup(popupContent)
                        .addTo(cellsLayer);
                });
            } catch (e) {
                console.error("Errore caricamento storm_cells.json:", e);
            }
        }

        loadStormCells();
        setInterval(loadStormCells, 300000);
    </script>
</body>
</html>
