<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Storm Tracker Europa</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        html, body, #map {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background: #0b0f19;
        }
        .storm-marker {
            background: transparent;
            border: none;
        }
        .cell-container {
            position: relative;
            width: 100px;
            height: 85px;
            transform: translate(-50%, -50%);
        }
        .centroid-ring {
            position: absolute;
            bottom: 8px;
            left: 50%;
            transform: translateX(-50%);
            width: 38px;
            height: 38px;
            border: 3.5px solid #22c55e;
            border-radius: 50%;
            background: rgba(34, 197, 94, 0.35);
            animation: pulse 1.5s infinite ease-in-out;
            box-shadow: 0 0 12px rgba(34, 197, 94, 0.9);
            z-index: 1;
        }
        @keyframes pulse {
            0% { transform: translateX(-50%) scale(0.85); opacity: 0.9; }
            50% { transform: translateX(-50%) scale(1.25); opacity: 0.3; }
            100% { transform: translateX(-50%) scale(0.85); opacity: 0.9; }
        }
        .cell-3d-profile {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 95px;
            height: 60px;
            object-fit: contain;
            z-index: 2;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.85));
        }
        .info-panel {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.95);
            padding: 10px 18px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            font-family: sans-serif;
            font-size: 13px;
            z-index: 1000;
            font-weight: bold;
            color: #1e293b;
        }
    </style>
</head>
<body>
    <div id="map"></div>
    <div class="info-panel" id="info-panel">
        Storm Tracker: <span id="cell-count">0</span> celle attive
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map', {
            zoomControl: true,
            attributionControl: false
        }).setView([43.5, 12.5], 6);

        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
            maxZoom: 12,
            minZoom: 4
        }).addTo(map);

        let cellsLayer = L.layerGroup().addTo(map);

        function getCardinalDirection(angle) {
            const directions = ['N', 'NNE', 'NE', 'ENE', 'E', 'ESE', 'SE', 'SSE', 'S', 'SSW', 'SW', 'WSW', 'W', 'WNW', 'NW', 'NNW'];
            const index = Math.round((angle % 360) / 22.5);
            return directions[index % 16];
        }

        async function loadStormCells() {
            try {
                let response = await fetch('storm_cells.json?' + new Date().getTime());
                let data = await response.json();
                
                cellsLayer.clearLayers();
                let structures = data.macro_structures || [];
                document.getElementById('cell-count').innerText = structures.length;

                if (data.radar_tile) {
                    let host = data.radar_tile.host;
                    let path = data.radar_tile.path;
                    L.tileLayer(`${host}${path}/256/{z}/{x}/{y}/2/1_1.png`, {
                        opacity: 0.6,
                        zIndex: 200
                    }).addTo(cellsLayer);
                }

                structures.forEach(cell => {
                    let center = cell.center;
                    
                    if (cell.actual_path && cell.actual_path.length > 0) {
                        L.polyline(cell.actual_path, {
                            color: '#2563eb',
                            weight: 4.5,
                            opacity: 0.9
                        }).addTo(cellsLayer);
                    }

                    if (cell.forecast_path && cell.forecast_path.length > 0) {
                        L.polyline(cell.forecast_path, {
                            color: '#22c55e',
                            weight: 4.5,
                            opacity: 0.9,
                            dashArray: '6, 8'
                        }).addTo(cellsLayer);
                    }

                    let markerHtml = `
                        <div class="cell-container">
                            <div class="centroid-ring"></div>
                            <img src="${cell.profile_image || 'profiles/Core-Standby-01.png'}?${new Date().getTime()}" class="cell-3d-profile" />
                        </div>
                    `;

                    let customIcon = L.divIcon({
                        className: 'storm-marker',
                        html: markerHtml,
                        iconSize: [100, 85],
                        iconAnchor: [50, 42]
                    });

                    let cardinalDir = getCardinalDirection(cell.direction_deg);
                    let convectiveType = cell.convective_type || 'Cella Convettiva';

                    let popupContent = `
                        <div style="font-family: sans-serif; font-size: 13px; line-height: 1.4; min-width: 215px;">
                            <b>ID Cellula:</b> ${cell.id}<br>
                            <b>Tipologia:</b> <span style="color: #2563eb; font-weight: bold;">${convectiveType}</span><br>
                            <b>Intensità:</b> ${cell.intensity}<br>
                            <b>Velocità:</b> ${cell.speed_kmh} km/h<br>
                            <b>Direzione:</b> ${cardinalDir} (${cell.direction_deg}°)<br>
                            <b>Echo Top:</b> <span style="color: #d97706; font-weight: bold;">${cell.echo_top} km</span><br>
                            <b>VIL:</b> ${cell.vil} kg/m²<br>
                            <b>Target:</b> <span style="color: #22c55e; font-weight: bold;">Proiezione 1h attiva</span>
                        </div>
                    `;

                    L.marker([center[0], center[1]], { icon: customIcon })
                        .bindPopup(popupContent)
                        .addTo(cellsLayer);
                });
            } catch (e) {
                console.error("Errore caricamento storm_cells.json:", e);
            }
        }

        loadStormCells();
        setInterval(loadStormCells, 300000);
    </script>
</body>
</html>
