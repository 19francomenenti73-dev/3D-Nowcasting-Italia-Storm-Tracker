<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <title>Nowcasting Italia - 3D Storm Tracker</title>
  <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no" />
  <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
  <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #090d16; overflow: hidden; font-family: system-ui, -apple-system, sans-serif; }
    #map { width: 100%; height: 100%; position: absolute; }
    #ui-panel {
      position: absolute; top: 10px; right: 10px; z-index: 10;
      background: rgba(15, 23, 42, 0.92); border: 1px solid #334155; color: #38bdf8;
      padding: 6px 10px; border-radius: 6px; font-size: 11px; font-weight: bold;
      box-shadow: 0 4px 6px rgba(0,0,0,0.4);
    }
    .maplibregl-popup-content {
      background: #0f172a !important; color: #f8fafc !important;
      border: 1px solid #334155; border-radius: 8px; padding: 10px; font-size: 11px;
    }
  </style>
</head>
<body>

<div id="ui-panel">Caricamento dati...</div>
<div id="map"></div>

<script>
  var map = new maplibregl.Map({
    container: 'map',
    style: 'https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json',
    center: [12.50, 42.00],
    zoom: 6.0,
    pitch: 45,
    bearing: -5,
    failIfMajorPerformanceCaveat: false
  });

  map.addControl(new maplibregl.NavigationControl());

  map.on('load', function () {
    fetchAndRender();
    setInterval(fetchAndRender, 30000);
  });

  function fetchAndRender() {
    // Bypass forzato della cache tramite timestamp
    var jsonUrl = './storm_cells.json?nocache=' + new Date().getTime();
    
    fetch(jsonUrl)
      .then(res => {
        if (!res.ok) throw new Error("HTTP Status " + res.status);
        return res.json();
      })
      .then(data => {
        // Estrazione flessibile delle celle
        var cells = [];
        if (Array.isArray(data)) {
          cells = data;
        } else if (data && Array.isArray(data.cells)) {
          cells = data.cells;
        } else if (data && Array.isArray(data.data)) {
          cells = data.data;
        }

        document.getElementById('ui-panel').innerHTML = `Celle 3D Attive (≥32 dBZ): ${cells.length}`;

        renderLayers(cells, data.radar_path);
      })
      .catch(err => {
        document.getElementById('ui-panel').innerHTML = "Errore caricamento JSON (" + err.message + ")";
      });
  }

  function renderLayers(cells, radarPath) {
    // Pulizia layer preesistenti
    ['cells-3d-walls', 'cells-3d-top', 'cells-vectors-blue', 'cells-vectors-red', 'centroid-green-circle', 'radar-tile-layer'].forEach(l => {
      if (map.getLayer(l)) map.removeLayer(l);
    });
    ['cells-src', 'vectors-src', 'centroids-src', 'radar-tile-source'].forEach(s => {
      if (map.getSource(s)) map.removeSource(s);
    });

    // Mosaico Radar di fondo se presente
    if (radarPath) {
      map.addSource('radar-tile-source', {
        'type': 'raster',
        'tiles': ['https://tile.rainviewer.com' + radarPath + '/256/{z}/{x}/{y}/2/1_1.png'],
        'tileSize': 256
      });
      map.addLayer({
        'id': 'radar-tile-layer',
        'type': 'raster',
        'source': 'radar-tile-source',
        'paint': { 'raster-opacity': 0.6 }
      });
    }

    if (!cells || cells.length === 0) return;

    var cellFeatures = [];
    var vectorFeatures = [];
    var centroidFeatures = [];

    cells.forEach(cell => {
      // Supporta sia contour_real che poly_base o coordinates
      var rawPoly = cell.contour_real || cell.poly_base || cell.geometry?.coordinates;
      if (!rawPoly || rawPoly.length < 3) return;

      var ring = rawPoly.map(pt => Array.isArray(pt) ? [pt[1], pt[0]] : [pt.lng, pt.lat]);
      ring.push(ring[0]);

      var dbz = cell.max_dbz || 35;
      var color = dbz >= 50 ? '#ef4444' : (dbz >= 42 ? '#f97316' : '#22c55e');
      var topHeight = ((cell.echo_top_km || 8) * 800);

      cellFeatures.push({
        'type': 'Feature',
        'properties': {
          'id': cell.id || 'TC',
          'color': color,
          'height': topHeight,
          'dbz': dbz,
          'stage': cell.stage || 'In osservazione',
          'wind': cell.wind_speed_kmh || 0,
          'eta': cell.eta_target || 'N/A'
        },
        'geometry': { 'type': 'Polygon', 'coordinates': [ring] }
      });

      if (cell.movement_vector && cell.movement_vector.length === 2) {
        vectorFeatures.push({
          'type': 'Feature',
          'properties': { 'type': 'blue' },
          'geometry': {
            'type': 'LineString',
            'coordinates': [[cell.movement_vector[0][1], cell.movement_vector[0][0]], [cell.movement_vector[1][1], cell.movement_vector[1][0]]]
          }
        });
      }

      if (cell.predictive_vector && cell.predictive_vector.length === 2) {
        vectorFeatures.push({
          'type': 'Feature',
          'properties': { 'type': 'red' },
          'geometry': {
            'type': 'LineString',
            'coordinates': [[cell.predictive_vector[0][1], cell.predictive_vector[0][0]], [cell.predictive_vector[1][1], cell.predictive_vector[1][0]]]
          }
        });
      }

      if (cell.centroid) {
        centroidFeatures.push({
          'type': 'Feature',
          'properties': {
            'id': cell.id || 'TC',
            'dbz': dbz,
            'stage': cell.stage || 'In osservazione',
            'wind': cell.wind_speed_kmh || 0,
            'eta': cell.eta_target || 'N/A'
          },
          'geometry': { 'type': 'Point', 'coordinates': [cell.centroid[1], cell.centroid[0]] }
        });
      }
    });

    if (cellFeatures.length > 0) {
      map.addSource('cells-src', { 'type': 'geojson', 'data': { 'type': 'FeatureCollection', 'features': cellFeatures } });
      
      map.addLayer({
        'id': 'cells-3d-walls',
        'type': 'fill-extrusion',
        'source': 'cells-src',
        'paint': {
          'fill-extrusion-color': '#64748b',
          'fill-extrusion-height': ['get', 'height'],
          'fill-extrusion-base': 0,
          'fill-extrusion-opacity': 0.35
        }
      });

      map.addLayer({
        'id': 'cells-3d-top',
        'type': 'fill-extrusion',
        'source': 'cells-src',
        'paint': {
          'fill-extrusion-color': ['get', 'color'],
          'fill-extrusion-height': ['get', 'height'],
          'fill-extrusion-base': ['-', ['get', 'height'], 200],
          'fill-extrusion-opacity': 0.85
        }
      });
    }

    if (vectorFeatures.length > 0) {
      map.addSource('vectors-src', { 'type': 'geojson', 'data': { 'type': 'FeatureCollection', 'features': vectorFeatures } });
      map.addLayer({
        'id': 'cells-vectors-blue',
        'type': 'line',
        'source': 'vectors-src',
        'filter': ['==', ['get', 'type'], 'blue'],
        'paint': { 'line-color': '#2563eb', 'line-width': 4 }
      });
      map.addLayer({
        'id': 'cells-vectors-red',
        'type': 'line',
        'source': 'vectors-src',
        'filter': ['==', ['get', 'type'], 'red'],
        'paint': { 'line-color': '#dc2626', 'line-width': 3, 'line-dasharray': [2, 2] }
      });
    }

    if (centroidFeatures.length > 0) {
      map.addSource('centroids-src', { 'type': 'geojson', 'data': { 'type': 'FeatureCollection', 'features': centroidFeatures } });
      map.addLayer({
        'id': 'centroid-green-circle',
        'type': 'circle',
        'source': 'centroids-src',
        'paint': {
          'circle-radius': 10,
          'circle-color': 'rgba(0,0,0,0)',
          'circle-stroke-width': 3,
          'circle-stroke-color': '#22c55e'
        }
      });

      map.on('click', 'centroid-green-circle', function (e) {
        var p = e.features[0].properties;
        new maplibregl.Popup()
          .setLngLat(e.lngLat)
          .setHTML(`<b>ID:</b> ${p.id}<br><b>Riflettività:</b> ${p.dbz} dBZ<br><b>Stadio:</b> ${p.stage}<br><b>ETA:</b> ${p.eta}`)
          .addTo(map);
      });
    }
  }
</script>
</body>
</html>
