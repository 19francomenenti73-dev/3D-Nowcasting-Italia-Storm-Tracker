<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Storm Tracker Europa</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        html, body, #map {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background: #0f172a;
        }
        .storm-marker-container {
            background: transparent;
            border: none;
        }
        .centroid-ring {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 60px;
            height: 60px;
            border: 4px solid #16a34a;
            border-radius: 50%;
            background: rgba(22, 163, 74, 0.3);
            animation: pulse-ring 1.5s infinite ease-in-out;
            box-shadow: 0 0 15px rgba(22, 163, 74, 0.9);
            z-index: 1;
        }
        @keyframes pulse-ring {
            0% { transform: translate(-50%, -50%) scale(0.8); opacity: 1; }
            50% { transform: translate(-50%, -50%) scale(1.25); opacity: 0.3; }
            100% { transform: translate(-50%, -50%) scale(0.8); opacity: 1; }
        }
        .cell-3d-img {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 2;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.7));
        }
        .info-panel {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.95);
            padding: 12px 20px;
            border-radius: 14px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
            font-family: sans-serif;
            font-size: 14px;
            z-index: 1000;
            display: flex;
            gap: 12px;
            align-items: center;
        }
    </style>
</head>
<body>
    <div id="map"></div>
    <div class="info-panel" id="info-panel">
        <b>Storm Tracker:</b> <span id="cell-count">0</span> celle attive
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Zoom ottimizzato centrato sull'area calda Italia/Europa centrale
        const map = L.map('map').setView([43.5, 12.5], 6);

        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'Tiles &copy; Esri'
        }).addTo(map);

        let cellsLayer = L.layerGroup().addTo(map);

        function getCardinalDirection(angle) {
            const directions = ['N', 'NNE', 'NE', 'ENE', 'E', 'ESE', 'SE', 'SSE', 'S', 'SSW', 'SW', 'WSW', 'W', 'WNW', 'NW', 'NNW'];
            const index = Math.round((angle % 360) / 22.5);
            return directions[index % 16];
        }

        async function loadStormCells() {
            try {
                let response = await fetch('storm_cells.json?' + new Date().getTime());
                let data = await response.json();
                
                cellsLayer.clearLayers();
                let structures = data.macro_structures || [];
                document.getElementById('cell-count').innerText = structures.length;

                if (data.radar_tile) {
                    let host = data.radar_tile.host;
                    let path = data.radar_tile.path;
                    L.tileLayer(`${host}${path}/256/{z}/{x}/{y}/2/1_1.png`, {
                        opacity: 0.6,
                        zIndex: 200
                    }).addTo(cellsLayer);
                }

                structures.forEach(cell => {
                    let center = cell.center;
                    
                    // Vettore Reale/Storico (Blu continuo - 15m)
                    if (cell.actual_path && cell.actual_path.length > 0) {
                        L.polyline(cell.actual_path, {
                            color: '#0055ff',
                            weight: 5,
                            opacity: 0.95
                        }).addTo(cellsLayer);
                    }

                    // Vettore Predittivo (Verde tratteggiato - 6h)
                    if (cell.forecast_path && cell.forecast_path.length > 0) {
                        L.polyline(cell.forecast_path, {
                            color: '#16a34a',
                            weight: 5,
                            opacity: 0.95,
                            dashArray: '8, 12'
                        }).addTo(cellsLayer);
                    }

                    // Dimensioni generose per rendere le celle verticali ben visibili
                    let baseW = cell.width_px ? Math.max(80, Math.min(200, cell.width_px * 2.5)) : 100;
                    let baseH = cell.height_px ? Math.max(50, Math.min(140, cell.height_px * 1.8)) : 70;

                    // Marker unificato: Anello pulsante verde sotto + Immagine 3D verticale sopra
                    let markerHtml = `
                        <div style="position: relative; width: ${baseW}px; height: ${baseH}px;">
                            <div class="centroid-ring"></div>
                            <img src="${cell.profile_image || 'profiles/Core-Standby-01.png'}?${new Date().getTime()}" class="cell-3d-img" style="width: ${baseW}px; height: ${baseH}px;" />
                        </div>
                    `;

                    let customIcon = L.divIcon({
                        className: 'storm-marker-container',
                        html: markerHtml,
                        iconSize: [baseW, baseH],
                        iconAnchor: [baseW / 2, baseH / 2]
                    });

                    let cardinalDir = getCardinalDirection(cell.direction_deg);
                    let etaText = cell.speed_kmh > 0 ? `Proiezione 6h attiva` : `N/D`;

                    let popupContent = `
                        <div style="font-family: sans-serif; font-size: 13px; line-height: 1.5; min-width: 210px;">
                            <b>ID Cellula:</b> ${cell.id}<br>
                            <b>Intensità:</b> ${cell.intensity}<br>
                            <b>Velocità:</b> ${cell.speed_kmh} km/h<br>
                            <b>Direzione:</b> ${cardinalDir} (${cell.direction_deg}°)<br>
                            <b>Echo Top:</b> <span style="color: #d97706; font-weight: bold;">${cell.echo_top} km</span><br>
                            <b>VIL:</b> ${cell.vil} kg/m²<br>
                            <b>Target:</b> <span style="color: #16a34a; font-weight: bold;">${etaText}</span>
                        </div>
                    `;

                    L.marker([center[0], center[1]], { icon: customIcon })
                        .bindPopup(popupContent)
                        .addTo(cellsLayer);
                });
            } catch (e) {
                console.error("Errore caricamento storm_cells.json:", e);
            }
        }

        loadStormCells();
        setInterval(loadStormCells, 300000);
    </script>
</body>
</html>
