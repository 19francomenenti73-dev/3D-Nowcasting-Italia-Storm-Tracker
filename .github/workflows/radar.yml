name: Update 3D Storm Tracker

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-tracker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests numpy opencv-python-headless Pillow

      - name: Run tracker script
        run: python tracker.py

      - name: Commit and push changes
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add centroids.json profiles/
          git status
          git diff --staged --quiet || git commit -m "Auto-update 3D radar data and profiles [skip ci]"
          git push || echo "Nessun aggiornamento da inviare o push già allineato"
          
